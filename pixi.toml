[workspace]
name = "doc-transformer"
version = "0.1.0"
description = "Document Transformer Prototype"
authors = ["Author"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[activation.env]
LD_LIBRARY_PATH = "/run/opengl-driver/lib"

[dependencies]
python = ">=3.14.4"
tqdm = ">=4.67.3"

[pypi-dependencies]
torch = ">=2.11.0"
sentence-transformers = ">=5.4.1"
transformers = ">=5.8.0"
matplotlib = ">=3.10.0"
tensorboard = ">=2.20.0, <3"
pandas = ">=2.0.0"
scikit-learn = ">=1.4.0"
matminer = ">=0.9.0"
pymatgen = ">=2024.1.0"


